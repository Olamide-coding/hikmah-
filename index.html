<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Hikmah ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:radial-gradient(circle at top,#ff5e9c,#ff004f 40%,#550018);
color:white;
}

/* ================= PIN SCREEN ================= */
#pinScreen{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#pinBox{
padding:20px;
background:#111;
border:2px solid #ff4d88;
border-radius:12px;
text-align:center;
box-shadow:0 0 20px #ff4d88;
}

#pinInput{
padding:10px;
font-size:18px;
margin-top:10px;
border:none;
outline:none;
border-radius:6px;
text-align:center;
}

#pinBtn{
margin-top:10px;
padding:10px 20px;
background:#ff4d88;
border:none;
color:white;
cursor:pointer;
border-radius:6px;
}

/* ================= CANVAS ================= */
#heartCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
}

/* ================= UI ================= */
.container{
position:absolute;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
opacity:0;
transition:1s;
}

.name{
position:absolute;
bottom:90px;
left:50%;
transform:translateX(-50%);
font-size:42px;
font-weight:bold;
letter-spacing:6px;
text-shadow:0 0 10px #fff,0 0 40px #ff0080;
animation:glow 2s infinite alternate;
}

.message{
position:absolute;
bottom:55px;
left:50%;
transform:translateX(-50%);
font-size:18px;
text-align:center;
}

.signature{
position:absolute;
bottom:15px;
left:50%;
transform:translateX(-50%);
font-size:14px;
opacity:.8;
}

@keyframes glow{
from{ text-shadow:0 0 10px white,0 0 25px pink; }
to{ text-shadow:0 0 20px white,0 0 60px hotpink; }
}
</style>
</head>

<body>

<!-- ================= PIN ================= -->
<div id="pinScreen">
<div id="pinBox">
<h2>Enter Access Code ❤️</h2>
<input type="password" id="pinInput" placeholder="Enter PIN">
<br>
<button id="pinBtn">Unlock</button>
</div>
</div>

<canvas id="heartCanvas"></canvas>

<div class="container" id="mainUI">
<div class="name">HIKMAH ❤️</div>
<div class="message" id="typing"></div>
<div class="signature">Best Regards ❤️<br>Sultan</div>
</div>

<script>

/* ================= PIN LOGIC ================= */
const correctPin = "sultan";

document.getElementById("pinBtn").onclick = () => {
const val = document.getElementById("pinInput").value.trim().toLowerCase();

if(val === correctPin){
document.getElementById("pinScreen").style.display="none";
document.getElementById("mainUI").style.opacity="1";

startAnimation(); // start everything AFTER unlock
}else{
alert("Wrong PIN 💔");
}
};

/* ================= CANVAS ================= */
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = innerWidth;
canvas.height = innerHeight;
}
resize();
window.addEventListener("resize",resize);

let particles = [];
let startHeart = false;

/* ================= SPARKLE CONVERGENCE FIRST ================= */
let sparks = [];

function initSparkles(){
for(let i=0;i<120;i++){
sparks.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
tx:canvas.width/2,
ty:canvas.height/2,
size:2+Math.random()*2
});
}
}

function animateSparkles(){
ctx.clearRect(0,0,canvas.width,canvas.height);

let done = true;

sparks.forEach(s=>{
s.x += (s.tx - s.x)*0.05;
s.y += (s.ty - s.y)*0.05;

ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();

if(Math.abs(s.x-s.tx)>1) done=false;
});

if(!done){
requestAnimationFrame(animateSparkles);
}else{
setTimeout(()=>initHeart(),800);
}
}

/* ================= HEART FORMATION ================= */
function heartShape(t){
return{
x:16*Math.pow(Math.sin(t),3),
y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
};
}

function initHeart(){
particles=[];

for(let i=0;i<600;i++){
const t=Math.random()*Math.PI*2;
const p=heartShape(t);

particles.push({
x:canvas.width/2,
y:canvas.height/2,
tx:canvas.width/2 + p.x*15,
ty:canvas.height/2 + p.y*15,
size:1+Math.random()*2
});
}

startHeart = true;
animateHeart();
}

function animateHeart(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.x += (p.tx-p.x)*0.03;
p.y += (p.ty-p.y)*0.03;

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

ctx.fillStyle="rgba(255,120,180,0.9)";
ctx.fill();
});

if(startHeart){
requestAnimationFrame(animateHeart);
}
}

/* ================= START FLOW ================= */
function startAnimation(){
initSparkles();
animateSparkles();
startTyping();
}

/* ================= REDUCED FLOATING EFFECTS ================= */
function createHeart(){
if(!startHeart) return;

const heart=document.createElement("div");
heart.innerHTML="❤️";
heart.style.position="absolute";
heart.style.left=Math.random()*100+"vw";
heart.style.bottom="-50px";
heart.style.fontSize=(15+Math.random()*25)+"px";
heart.style.animation="float 6s linear";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),7000);
}

setInterval(createHeart,400); // reduced spam

/* ================= TYPEWRITER ================= */
const messages=[
"You're Amazing ❤️",
"HIKMAH ❤️",
"You Make Life Beautiful ✨",
"Forever Special 💖"
];

let msg=0;
let char=0;

function startTyping(){

function type(){
const box=document.getElementById("typing");

if(char < messages[msg].length){
box.innerHTML += messages[msg][char];
char++;
setTimeout(type,70);
}else{
setTimeout(()=>{
box.innerHTML="";
char=0;
msg=(msg+1)%messages.length;
type();
},1500);
}
}

type();
}

</script>

</body>
</html>
